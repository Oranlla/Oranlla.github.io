<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沒有人的首頁</title>
    <!-- 引入 Tailwind CSS 以進行快速且美觀的樣式設計 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 引入 Google 字體 */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen text-gray-800">

    <!-- 主要內容區塊 (卡片設計) -->
    <main class="bg-white p-8 md:p-12 rounded-2xl shadow-lg max-w-lg w-full mx-4 transition-all duration-300 hover:shadow-xl">
        
        <!-- 標題區 -->
        <header class="text-center mb-8">
            <div class="inline-block p-3 bg-blue-100 text-blue-600 rounded-full mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Hello, World!</h1>
        </header>

        <!-- 內容區 -->
        <section class="space-y-4 text-gray-600 leading-relaxed">
        <p></p>
        <a href="https://www.youtube.com/@JosuijiShinri" target="_blank">
            <img src="images/Shinri_ifeeltiredandsadnow.png" alt="Shinri feels tire dand sad now." title="subscribe koipapa" style="max-width:100%; height:auto;">
</a>
        </section>

        <!-- 底部互動區 (如按鈕) -->
        <footer class="mt-8 text-center">
            <button onclick="showMessage()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2" class="track-btn" data-key="clicknothing">
                click for nothing
            </button>
            <p id="message-area" class="mt-4 text-sm text-green-600 font-medium hidden">
                ✅ It worked and wasted you about <span><strong id="count-clicknothing">0</strong></span> second.
            </p>
        </footer>

    </main>

    <!-- 簡單的 JavaScript 互動 -->
    <script>
        function showMessage() {
            const messageArea = document.getElementById('message-area');
            messageArea.classList.remove('hidden');
            // 設定 3 秒後自動隱藏
            setTimeout(() => {
                messageArea.classList.add('hidden');
            }, 3000);
        }

                // 設定儲存在瀏覽器 localStorage 中的資料鍵名
          const STORAGE_KEY = 'buttonClickCounts';
        
          // 從瀏覽器讀取先前儲存的點擊紀錄；若無紀錄則建立空物件 {}
          const counts = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        
          // 更新畫面上的各別點擊次數與總點擊次數
          function updateDisplay() {
            let total = 0;
        
            // 找出所有帶有 track-btn 類別的按鈕並逐一更新顯示
            document.querySelectorAll('.track-btn').forEach(btn => {
              const key = btn.dataset.key;       // 取得按鈕的 data-key 名稱
              const count = counts[key] || 0;    // 取得該按鈕的次數，若無紀錄則為 0
              total += count;                    // 累加至總點擊次數
        
              // 找到對應的顯示元素並更新數字
              const countEl = document.getElementById(`count-${key}`);
              if (countEl) countEl.textContent = count;
            });
        
            // 更新畫面上的總點擊次數
            const totalEl = document.getElementById('total-count');
            if (totalEl) totalEl.textContent = total;
          }
        
          // 為每個帶有 track-btn 類別的按鈕綁定點擊事件
          document.querySelectorAll('.track-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              const key = btn.dataset.key;
              // 將該按鈕的點擊次數加 1
              counts[key] = (counts[key] || 0) + 1;
              // 將更新後的紀錄轉成 JSON 字串並存回瀏覽器 localStorage
              localStorage.setItem(STORAGE_KEY, JSON.stringify(counts));
              // 重新整理畫面數字
              updateDisplay();
            });
          });
        
          // 頁面載入完成時，先執行一次以顯示瀏覽器中已儲存的紀錄
          updateDisplay();
    </script>
</body>
</html>
